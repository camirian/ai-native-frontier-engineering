<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#52627a}.label{font-size:16px;font-weight:600}.note{font-size:13px;fill:#52627a}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="48" class="title">NUM-SYNTH-001 solver evidence summary</text><rect x="50" y="65" width="900" height="42" rx="6" fill="#fef3c7"/><text x="70" y="92" class="label">HISTORICAL TIMING RECORD — NOT A ROBUST BENCHMARK</text><text x="50" y="150" class="label">Public reproduction: five recorded cases × two solvers</text><rect x="50" y="180" width="500" height="28" fill="#2563eb"/><text x="60" y="201" fill="white" class="label">Numerical validity replay</text><text x="50" y="270" class="label">Historical record: 25 valid solver-result rows</text><text x="50" y="300" class="note">Process-recorded only; held-out secrecy is not cryptographically proven.</text><text x="50" y="370" class="label">Adversarial over-relaxed Jacobi control: 8 / 8 design cases invalid</text><rect x="50" y="395" width="500" height="28" fill="#dc2626"/><text x="60" y="416" fill="white" class="label">8 failures</text><text x="50" y="480" class="note">Historical timing aggregates and a new transparent timing sample are in experiment evidence.</text></svg>