<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#52627a}.label{font-size:16px;font-weight:600}.note{font-size:13px;fill:#52627a}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="48" class="title">G06 held-out stress utilization</text><text x="50" y="76" class="sub">Ratios above 1.0 violate the frozen stress constraint. Equilibrium residuals remained near numerical precision.</text><line x1="60" y1="368" x2="900" y2="368" stroke="#dc2626" stroke-width="3"/><text x="905" y="373" class="note">1.0 limit</text><rect x="90" y="390" width="100" height="-28.093253687990185" fill="#dc2626"/><text x="75" y="425" class="note">H_asymmetric_combo</text><text x="105" y="375" class="label">1.28</text><rect x="350" y="390" width="100" height="-275.0" fill="#dc2626"/><text x="335" y="425" class="note">H_edge_down</text><text x="365" y="375" class="label">12.50</text><rect x="610" y="390" width="100" height="-38.008519695516156" fill="#dc2626"/><text x="595" y="425" class="note">H_reversed_asymmetry</text><text x="625" y="375" class="label">1.73</text><text x="50" y="500" class="note">This evaluates a synthetic normalized truss model only; it does not describe a physical structure.</text></svg>